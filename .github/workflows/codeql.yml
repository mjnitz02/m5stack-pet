name: CodeQL

# The firmware, the Python tools and the workflow files all analyze without a
# build step, so this is cheap enough to run on every PR alongside CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 11:17 UTC. Offset from the other repos so the weekly runs don't
    # all queue at once. The schedule matters even with PR runs: it re-analyzes
    # existing code against newly published queries.
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploading results to the Security tab needs write here; everything
      # else stays read-only.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode: none rather than tracing a real `pio run`. A traced
          # build would also compile the Arduino core and M5Unified, which
          # are not this repo's code, with a cross-compiler CodeQL may not
          # recognise. Without a build the Arduino and M5Unified headers are
          # missing, so analysis of calls into them is approximate.
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
          # The workflows under .github/workflows: script injection, missing
          # permissions blocks, unpinned actions and the like.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}
