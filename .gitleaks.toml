# gitleaks config — extends the built-in default ruleset.
# https://github.com/gitleaks/gitleaks#configuration
title = "m5stack-pet gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Paths that are binary assets or build output, not source — scanning them just wastes time / risks false positives on compressed bytes."
paths = [
  '''(^|/)\.pio/''',
  '''(^|/)__pycache__/''',
  '''\.png$''',
  '''\.jpg$''',
  '''\.jpeg$''',
]
